<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Timer Pro</title>
<link rel="icon" type="image/png" href="Icon/timo.ico">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="food-market.css">
<style>
:root {
  --bg-color: #0b0f19;
  --card-bg: #111827;
  --card-border: #1f293d;
  --input-bg: #0b0f19;
  --text-color: #f3f4f6;
  --subtext-color: #9ca3af;
  --border-color: #1f293d;
  --primary-color: #6366f1;
  --primary-hover: #4f46e5;
  --primary-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
  --accent-color: #8b5cf6;
  --success-color: #10b981;
  --danger-color: #ef4444;
  --warning-color: #f59e0b;
  --gold-color: #fbbf24;
  --shadow-sm: 0 2px 4px rgba(0,0,0,0.2);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.5);
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 24px;
}
[data-theme="light"] {
  --bg-color: #f3f4f6;
  --card-bg: #ffffff;
  --card-border: #e5e7eb;
  --input-bg: #f9fafb;
  --text-color: #111827;
  --subtext-color: #6b7280;
  --border-color: #e5e7eb;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo','Plus Jakarta Sans',system-ui,sans-serif; transition: background-color 0.25s ease, border-color 0.25s ease; }
body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; padding: 20px 15px; }
#app-container, #auth-screen { width: 100%; max-width: 1100px; margin: 0 auto; }
h1,h2,h3,h4 { font-weight: 800; margin-bottom: 14px; padding-bottom: 6px; border-bottom: 2px solid var(--border-color); }
h1 { font-size: 1.8rem; text-align: center; color: var(--primary-color); border-bottom: 3px solid var(--primary-color); }
h2 { font-size: 1.4rem; color: var(--text-color); border-inline-start: 4px solid var(--primary-color); padding-inline-start: 10px; border-bottom: 1px dashed var(--border-color); }
h3 { font-size: 1.15rem; color: var(--accent-color); border-inline-start: 3px solid var(--accent-color); padding-inline-start: 8px; }
.card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 20px; box-shadow: var(--shadow-md); }
.hidden { display: none !important; }
.top-bar { display: flex; flex-direction: column; gap: 16px; background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-lg); padding: 20px 24px; margin-bottom: 24px; }
.top-bar-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.user-profile-header { display: flex; align-items: center; gap: 12px; font-size: 1.2rem; font-weight: 800; }
.streak-badge { background: rgba(245,158,11,0.15); color: var(--warning-color); border: 1px solid rgba(245,158,11,0.3); padding: 6px 14px; border-radius: 50px; font-size: 0.9rem; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.currency-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 12px; width: 100%; }
.currency-card { display: flex; align-items: center; gap: 14px; padding: 14px 18px; background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: var(--radius-md); }
.currency-icon { font-size: 1.8rem; }
.currency-info { display: flex; flex-direction: column; }
.currency-label { font-size: 0.8rem; color: var(--subtext-color); font-weight: 600; }
.currency-value { font-weight: 800; font-size: 1.15rem; }
.btn { padding: 10px 18px; border-radius: var(--radius-md); font-weight: 700; font-size: 0.95rem; border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-shadow: var(--shadow-sm); }
.btn:hover { transform: translateY(-2px); }
.small-btn { padding: 6px 12px; font-size: 0.85rem; border-radius: var(--radius-sm); }
.subject-btn,.primary-btn,.success-btn { background: var(--primary-gradient); color: #fff; }
.success-btn { background: var(--success-color); }
.cancel-btn { background-color: var(--danger-color); color: white; }
.secondary-btn { background-color: var(--bg-color); color: var(--text-color); border: 1px solid var(--border-color); }
.full-width-btn { width: 100%; }
.flex-1 { flex: 1; }
.responsive-flex { display: flex; gap: 10px; flex-wrap: wrap; }
.subjects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px,1fr)); gap: 12px; }
.subject-card { background: var(--bg-color); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 18px; text-align: center; cursor: pointer; transition: all 0.2s; }
.subject-card:hover { border-color: var(--primary-color); transform: translateY(-3px); box-shadow: var(--shadow-md); }
.subject-card .icon { font-size: 2rem; margin-bottom: 8px; display: block; }
.shop-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px,1fr)); gap: 12px; }
.shop-item { background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; text-align: center; }
.shop-item-img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; }
.shop-item-price { font-weight: bold; color: var(--warning-color); margin-top: 6px; }
.timer-display { font-size: 4rem; font-weight: 800; text-align: center; color: var(--primary-color); margin: 20px 0; letter-spacing: 2px; }
.input-field { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 10px; background: var(--input-bg); color: var(--text-color); margin-top: 5px; font-size: 1rem; }
.form-group { margin-bottom: 14px; text-align: start; }
.instruction { text-align: center; color: var(--subtext-color); margin-bottom: 16px; }
.history-list { list-style: none; padding: 0; }
.history-item { background: var(--bg-color); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 14px; margin-bottom: 10px; }
.badge-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 10px; }
.badge-card { background: var(--bg-color); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 12px; text-align: center; opacity: 0.5; }
.badge-card.unlocked { opacity: 1; border-color: var(--gold-color); background: rgba(251,191,36,0.08); box-shadow: 0 0 12px rgba(251,191,36,0.2); }
.todo-item { display: flex; align-items: center; gap: 10px; background: var(--bg-color); border: 1px solid var(--border-color); padding: 10px 12px; border-radius: 10px; margin-bottom: 8px; }
.todo-item.done { opacity: 0.6; text-decoration: line-through; }
.ambient-controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 15px 0; }
.ambient-btn { padding: 8px 14px; border-radius: 20px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); cursor: pointer; font-weight: 600; }
.ambient-btn.active { background: var(--primary-color); color: #fff; border-color: var(--primary-color); }
.zen-mode .top-bar, .zen-mode #subject-selection .card:not(#timer-screen), .zen-mode .history-card, .zen-mode .site-footer, .zen-mode #prayer-card { display: none !important; }
.zen-mode #timer-screen { margin-top: 10vh; border: 2px solid var(--primary-color); box-shadow: 0 0 30px rgba(99,102,241,0.3); }
.theme-switch { position: relative; display: inline-block; width: 55px; height: 30px; }
.theme-switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; top:0; left:0; right:0; bottom:0; background-color: #6366f1; transition: .4s; border-radius: 34px; display:flex; align-items:center; justify-content:space-between; padding:0 5px; }
.slider:before { position:absolute; content:""; height:22px; width:22px; left:4px; bottom:4px; background-color:white; transition:.4s; border-radius:50%; z-index:2; }
input:checked + .slider { background-color: #4f46e5; }
input:checked + .slider:before { transform: translateX(25px); }

@media (max-width: 640px) {  .timer-display { font-size: 3rem; } }
.leaderboard-item { display:flex; justify-content:space-between; padding:10px 14px; background:var(--bg-color); border-radius:10px; margin-bottom:6px; border:1px solid var(--border-color); }
.site-footer { padding:18px 12px 24px; border-top:1px solid var(--border-color); color:var(--subtext-color); text-align:center; font-size:0.85rem; line-height:1.8; }
.game-container { display:flex; justify-content:center; align-items:center; background:#000; border-radius:12px; overflow:hidden; border:2px solid var(--border-color); margin:0 auto; max-width:340px; }
#miniGameCanvas { background: linear-gradient(to bottom, #1a202c, #2d3748); touch-action:none; }

/* 🕌 مواقيت الصلاة - شكل فاخر من Study-Timer-Pro.html */
#prayer-card{
  background: linear-gradient(135deg, #0f172a 0%, #111827 50%, #1e1b4b 100%) !important;
  border: 1px solid rgba(251,191,36,0.25) !important;
  border-radius: 20px !important;
  padding: 22px !important;
  position: relative;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.4), inset 0 1px 0 rgba(251,191,36,0.1) !important;
}
#prayer-card::before{
  content: '﷽';
  position: absolute;
  top: 12px;
  left: 20px;
  font-size: 3.5rem;
  opacity: 0.04;
  color: var(--gold-color);
  pointer-events: none;
}
#prayer-card::after{
  content: '';
  position: absolute;
  top: -50%;
  right: -20%;
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, transparent 70%);
  pointer-events: none;
}
.prayer-header{
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px dashed rgba(251,191,36,0.2);
}
.prayer-header h3{
  margin: 0 !important;
  border: none !important;
  padding: 0 !important;
  color: var(--gold-color) !important;
  font-size: 1.25rem !important;
  display: flex;
  align-items: center;
  gap: 10px;
}
.prayer-header h3::before{content: '🕌'; font-size: 1.5rem;}
.prayer-location{
  font-size: 0.85rem;
  color: var(--subtext-color);
  background: rgba(251,191,36,0.1);
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid rgba(251,191,36,0.2);
}
.prayer-grid{display: grid; grid-template-columns: repeat(5,1fr); gap: 10px; position: relative; z-index: 1;}
.prayer-item{
  background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 100%);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  padding: 14px 8px;
  text-align: center;
  position: relative;
  transition: all 0.3s ease;
  backdrop-filter: blur(10px);
}
.prayer-item:hover{transform: translateY(-3px); border-color: rgba(251,191,36,0.3); box-shadow: 0 8px 20px rgba(0,0,0,0.3);}
.prayer-item.next-prayer{
  background: linear-gradient(135deg, rgba(251,191,36,0.15) 0%, rgba(245,158,11,0.1) 100%);
  border: 1.5px solid var(--gold-color);
  box-shadow: 0 0 20px rgba(251,191,36,0.25), inset 0 1px 0 rgba(251,191,36,0.2);
  transform: scale(1.03);
}
.prayer-item.next-prayer::after{
  content: attr(data-next);
  position: absolute;
  top: -8px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--gold-color);
  color: #000;
  font-size: 0.65rem;
  font-weight: 800;
  padding: 2px 8px;
  border-radius: 10px;
}
.prayer-icon{font-size: 1.6rem; margin-bottom: 6px; display: block;}
.prayer-name{font-weight: 800; font-size: 0.95rem; color: var(--text-color); margin-bottom: 4px;}
.prayer-time{font-weight: 700; font-size: 1.1rem; color: var(--gold-color); direction: ltr; font-family: monospace;}
.prayer-item.next-prayer .prayer-time{color: #fde68a; font-size: 1.2rem;}
.prayer-countdown{margin-top:8px; padding-top:6px; border-top:1px dashed rgba(255,255,255,0.1); font-family: monospace; direction: ltr; font-size:0.85rem; font-weight:700; color: var(--subtext-color); font-variant-numeric: tabular-nums; letter-spacing:0.5px;}
.prayer-countdown.passed{opacity:0.55; font-family:inherit; direction:inherit; font-weight:600; letter-spacing:0;}
.signup-guide{background:rgba(99,102,241,0.1); border:1px solid rgba(99,102,241,0.35); border-radius:14px; padding:14px 16px; margin-bottom:16px; text-align:start;}
.signup-guide h4{margin:0 0 10px; border:none; padding:0; font-size:1rem;}
.signup-guide ul{list-style:none; padding:0; margin:0; display:grid; gap:9px;}
.signup-guide li{font-size:0.87rem; line-height:1.75; color:var(--subtext-color);}
.signup-guide li b{color:var(--text-color);}
.signup-guide code{direction:ltr; unicode-bidi:embed; display:inline-block; background:var(--bg-color); padding:0 7px; border-radius:6px; color:var(--warning-color); font-weight:700;}
.grade-bar{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; background:var(--bg-color); border:1px solid var(--border-color); border-radius:12px; padding:10px 14px; margin-bottom:14px; font-weight:700; font-size:0.92rem;}
.grade-note{background:rgba(251,191,36,0.1); border:1px solid rgba(251,191,36,0.35); border-radius:12px; padding:10px 12px; font-size:0.85rem; line-height:1.7; margin-bottom:12px; text-align:start;}
.subj-preview{margin-bottom:12px; text-align:start;}
.subj-preview .lbl{display:block; font-weight:700; font-size:0.9rem; margin-bottom:6px;}
.subj-chip{display:inline-flex; gap:6px; align-items:center; background:var(--bg-color); border:1px solid var(--border-color); border-radius:20px; padding:4px 10px; font-size:0.8rem; margin:0 0 6px; margin-inline-end:6px;}
.subj-tag{display:inline-block; margin-top:6px; font-size:0.7rem; font-weight:800; padding:2px 8px; border-radius:10px;}
.subj-tag.pf{background:rgba(245,158,11,0.18); color:var(--warning-color);}
.subj-tag.adv{background:rgba(99,102,241,0.2); color:var(--primary-color);}
.inbox-badge{background:var(--danger-color); color:#fff; border-radius:10px; padding:1px 7px; font-size:0.75rem; font-weight:800; margin-inline-start:6px;}
.inbox-item{display:flex; gap:12px; align-items:flex-start; background:var(--bg-color); border:1px solid var(--border-color); border-radius:14px; padding:14px; margin-bottom:10px; text-align:start;}
.inbox-item.new{border-inline-start:4px solid var(--warning-color); background:rgba(251,191,36,0.08);}
.inbox-icon{font-size:1.8rem; flex-shrink:0;}
.inbox-text{font-weight:700; line-height:1.7;}
.inbox-meta{font-size:0.8rem; color:var(--subtext-color); margin-top:4px;}
.inbox-new-tag{background:var(--warning-color); color:#1f2937; font-size:0.7rem; font-weight:800; padding:2px 8px; border-radius:10px; margin-inline-start:6px;}
.prayer-item.next-prayer .prayer-countdown{color:#fde68a; font-size:1rem; border-top-color:rgba(251,191,36,0.35);}
#next-prayer-left{font-family: monospace; direction:ltr; display:inline-block; font-variant-numeric: tabular-nums;}
#next-prayer-info{
  margin-top: 14px;
  text-align: center;
  background: linear-gradient(135deg, rgba(251,191,36,0.12) 0%, rgba(99,102,241,0.12) 100%);
  border: 1px solid rgba(251,191,36,0.2);
  border-radius: 12px;
  padding: 10px 14px;
  font-weight: 700;
  position: relative;
  z-index: 1;
}
@media(max-width:700px){.prayer-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:480px){.prayer-grid{grid-template-columns:repeat(2,1fr)}.prayer-item{padding:12px 6px}}


/* ====================== إضافات النسخة المصححة ====================== */
body { overflow-x: hidden; }
button { font-family: inherit; }
button:active:not(:disabled) { transform: translateY(0) scale(0.98); }
:focus-visible { outline: 2px solid var(--primary-color); outline-offset: 2px; }
.nav-controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
#auth-screen { max-width: 460px; margin-top: 6vh; }
.auth-top { display: flex; justify-content: flex-end; margin-bottom: 6px; }
.stats-bar { font-weight: 700; color: var(--subtext-color); }

/* ---- نوافذ الحوار (بديل alert / confirm / prompt) ---- */
.modal-overlay { position: fixed; inset: 0; z-index: 1000; background: rgba(2,6,23,0.65); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 16px; animation: fadeIn .18s ease; }
.modal-overlay.closing { opacity: 0; transition: opacity .15s ease; }
.modal { width: 100%; max-width: 420px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 22px; padding: 26px 22px 20px; box-shadow: var(--shadow-lg); text-align: center; animation: popIn .22s cubic-bezier(.2,.9,.3,1.2); max-height: 90vh; overflow-y: auto; }
.modal-icon { font-size: 2.4rem; width: 70px; height: 70px; margin: 0 auto 12px; display: grid; place-items: center; border-radius: 50%; background: rgba(99,102,241,0.14); }
.modal-title { margin: 0 0 8px !important; padding: 0 !important; border: none !important; font-size: 1.25rem !important; color: var(--text-color) !important; }
.modal-msg { color: var(--subtext-color); line-height: 1.8; font-size: 0.97rem; }
.modal-msg strong { color: var(--text-color); }
.modal-input-wrap { margin-top: 14px; text-align: start; }
.modal-input-wrap label { font-weight: 700; font-size: 0.9rem; }
.modal-error { color: var(--danger-color); font-size: 0.85rem; min-height: 1.2em; margin-top: 6px; font-weight: 600; }
.modal-actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.modal-actions .btn { flex: 1; min-width: 120px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.chip { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); font-weight: 700; cursor: pointer; }
.chip:hover { border-color: var(--primary-color); color: var(--primary-color); }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes popIn { from { opacity: 0; transform: scale(.92) translateY(10px); } to { opacity: 1; transform: none; } }

/* ---- إشعارات سريعة ---- */
#toast-root { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 1100; display: flex; flex-direction: column; gap: 8px; align-items: center; width: calc(100% - 24px); max-width: 420px; pointer-events: none; }
.toast { background: var(--card-bg); color: var(--text-color); border: 1px solid var(--card-border); border-inline-start: 4px solid var(--primary-color); padding: 12px 16px; border-radius: 14px; box-shadow: var(--shadow-lg); font-weight: 700; font-size: 0.93rem; animation: popIn .22s ease; width: 100%; }
.toast.success { border-inline-start-color: var(--success-color); }
.toast.error { border-inline-start-color: var(--danger-color); }
.toast.warn { border-inline-start-color: var(--warning-color); }

/* ---- بطاقات وقت اللعب والمشاهدة ---- */
.reward-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.reward-card { position: relative; display: flex; flex-direction: column; gap: 14px; padding: 20px 18px 18px; border-radius: var(--radius-md); border: 1px solid var(--border-color); background: var(--bg-color); overflow: hidden; }
.reward-card::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--accent); }
.reward-card.game { --accent: linear-gradient(90deg,#10b981,#34d399); --tint: rgba(16,185,129,0.14); }
.reward-card.watch { --accent: linear-gradient(90deg,#8b5cf6,#ec4899); --tint: rgba(139,92,246,0.16); }
.reward-head { display: flex; align-items: center; gap: 14px; }
.reward-icon { font-size: 2.1rem; width: 60px; height: 60px; display: grid; place-items: center; border-radius: 18px; background: var(--tint); flex-shrink: 0; }
.reward-name { font-weight: 800; font-size: 1.05rem; }
.reward-minutes { font-size: 2.1rem; font-weight: 800; line-height: 1.1; }
.reward-minutes small { font-size: 0.9rem; color: var(--subtext-color); font-weight: 600; }
.reward-hint { font-size: 0.82rem; color: var(--subtext-color); line-height: 1.6; min-height: 2.6em; }
.reward-btn { width: 100%; padding: 13px; font-size: 1.02rem; color: #fff; }
.reward-card.game .reward-btn { background: linear-gradient(135deg,#10b981,#059669); }
.reward-card.watch .reward-btn { background: linear-gradient(135deg,#8b5cf6,#6366f1); }
.reward-card.is-empty .reward-btn { background: transparent; color: var(--subtext-color); border: 1px dashed var(--border-color); box-shadow: none; }
.reward-card.is-empty .reward-minutes { color: var(--subtext-color); }

/* ---- شريط حد الـ 5 دقائق ---- */
.finish-gate { margin: 6px auto 14px; max-width: 460px; text-align: center; }
.gate-bar { height: 10px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 20px; overflow: hidden; }
#gate-fill { height: 100%; width: 0; background: linear-gradient(90deg,#f59e0b,#fbbf24); border-radius: 20px; transition: width .6s ease; }
.finish-gate.ready #gate-fill { background: linear-gradient(90deg,#10b981,#34d399); }
#finish-hint { margin-top: 8px; font-size: 0.9rem; font-weight: 700; color: var(--warning-color); }
.finish-gate.ready #finish-hint { color: var(--success-color); }
#finish-btn.is-locked { opacity: 0.65; filter: saturate(0.6); }
.credits-line { text-align: center; margin-top: 10px; font-size: 0.85rem; color: var(--subtext-color); }

/* ---- دليل الاستخدام ---- */
.guide-hero { text-align: center; padding: 26px 18px; border-radius: 20px; margin-bottom: 18px; background: linear-gradient(135deg, rgba(99,102,241,0.25), rgba(139,92,246,0.18) 55%, rgba(251,191,36,0.14)); border: 1px solid rgba(99,102,241,0.3); }
.guide-hero h2 { border: none !important; padding: 0 !important; margin: 0 0 8px; font-size: 1.7rem; }
.guide-hero p { color: var(--subtext-color); line-height: 1.8; }
.guide-section-title { margin: 22px 0 12px; border: none !important; padding: 0 !important; font-size: 1.15rem; color: var(--text-color) !important; }
.guide-steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; counter-reset: step; }
.guide-step { position: relative; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 18px 16px 16px; }
.guide-step .num { width: 34px; height: 34px; border-radius: 50%; background: var(--primary-gradient); color: #fff; display: grid; place-items: center; font-weight: 800; margin-bottom: 10px; }
.guide-step strong { display: block; margin-bottom: 4px; }
.guide-step span.d { color: var(--subtext-color); font-size: 0.9rem; line-height: 1.7; }
.guide-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 14px; }
.guide-card { background: var(--bg-color); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 16px 18px; text-align: start; }
.guide-card h4 { border: none; padding: 0; margin: 0 0 8px; font-size: 1.05rem; }
.guide-card p, .guide-card li { color: var(--subtext-color); font-size: 0.92rem; line-height: 1.85; }
.guide-card ul { padding-inline-start: 20px; }
.guide-card b { color: var(--text-color); }
.star-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.9rem; }
.star-table th, .star-table td { padding: 6px 10px; border-bottom: 1px dashed var(--border-color); text-align: center; }
.star-table th { color: var(--text-color); }
.star-table td:last-child { color: var(--warning-color); font-weight: 800; }
.faq details { background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px 16px; margin-bottom: 8px; text-align: start; }
.faq summary { cursor: pointer; font-weight: 800; }
.faq details p { margin-top: 8px; color: var(--subtext-color); line-height: 1.8; font-size: 0.92rem; }

/* ---- أخرى ---- */
.user-admin-card { background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
.user-admin-card.banned { border-color: var(--danger-color); }
.user-admin-card.online { border-color: var(--success-color); }
.user-status-badge { font-size: 0.8rem; font-weight: 700; padding: 4px 10px; border-radius: 20px; background: var(--card-bg); }
.user-status-badge.online { color: var(--success-color); }
.user-status-badge.banned { color: var(--danger-color); }
.user-status-badge.offline { color: var(--subtext-color); }
.history-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.history-top h3 { margin: 0; border: none; padding: 0; }
@media (max-width: 640px) { .nav-controls { width: 100%; } .modal-actions .btn { min-width: 100px; } #leaderboard-screen > div[style*="grid"] { grid-template-columns: 1fr !important; } }
#prayer-card { --text-color: #f3f4f6; --subtext-color: #9ca3af; color: #f3f4f6; }

.zen-mode #exam-waiting-lounge { display: none !important; }

/* ====================== نظام الرتب والمستويات ====================== */
.level-chip { background: rgba(139,92,246,0.18); color: var(--accent-color); border: 1px solid rgba(139,92,246,0.4); padding: 3px 10px; border-radius: 50px; font-size: 0.8rem; font-weight: 800; }
.rank-card { border: 1px solid rgba(139,92,246,0.35); background: linear-gradient(135deg, rgba(99,102,241,0.12), rgba(251,191,36,0.07)); }
.rank-head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.rank-emblem { width: 84px; height: 84px; flex-shrink: 0; border-radius: 50%; display: grid; place-items: center; font-size: 2.6rem; border: 3px solid var(--tier-color, #6366f1); background: var(--bg-color); box-shadow: 0 0 18px var(--tier-color, #6366f1); }
.rank-info { flex: 1; min-width: 180px; }
.rank-tier-name { font-size: 1.35rem; font-weight: 800; color: var(--tier-color, var(--text-color)); }
.rank-sub { color: var(--subtext-color); font-size: 0.85rem; font-weight: 600; }
.prog-label { display: flex; justify-content: space-between; gap: 8px; font-size: 0.82rem; font-weight: 700; margin: 10px 0 4px; color: var(--subtext-color); flex-wrap: wrap; }
.prog { height: 10px; border-radius: 20px; background: var(--bg-color); border: 1px solid var(--border-color); overflow: hidden; }
.prog > i { display: block; height: 100%; width: 0; background: var(--bar, #6366f1); border-radius: 20px; transition: width .6s ease; }
.rank-latest { margin-top: 14px; display: grid; gap: 6px; }
.log-item { display: flex; gap: 10px; align-items: center; padding: 9px 12px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 12px; text-align: start; font-size: 0.9rem; font-weight: 600; }
.log-item .ic { font-size: 1.3rem; flex-shrink: 0; }
.log-item small { display: block; color: var(--subtext-color); font-weight: 600; }
.ach-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; }
.ach-tabs .btn.active { background: var(--primary-gradient); color: #fff; border-color: transparent; }
.rk-result { margin-top: 16px; padding: 18px 14px; border-radius: 18px; border: 2px solid var(--rc, #6366f1); background: var(--bg-color); text-align: center; }
.rk-letter { font-size: 5rem; font-weight: 800; line-height: 1; text-shadow: 0 0 22px var(--rc, #6366f1); }
.rk-sub { font-weight: 800; margin-top: 4px; }
.rk-stats { color: var(--subtext-color); font-size: 0.9rem; margin: 6px 0 10px; }
.rk-chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 10px; }
.rk-chip { padding: 5px 14px; border-radius: 20px; font-weight: 800; border: 1px solid var(--border-color); }
.rk-chip.pos { color: var(--success-color); border-color: rgba(16,185,129,0.5); }
.rk-chip.neg { color: var(--danger-color); border-color: rgba(239,68,68,0.5); }
.rk-bd { list-style: none; padding: 0; margin: 8px auto; max-width: 360px; font-size: 0.88rem; }
.rk-bd li { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px dashed var(--border-color); }
.rk-bd .pos { color: var(--success-color); } .rk-bd .neg { color: var(--danger-color); }
.rk-note { font-size: 0.85rem; font-weight: 700; margin-top: 8px; }
.rk-badges { margin-top: 10px; }
.qf-modal { max-width: 470px; text-align: start; }
.qf-modal .modal-icon, .qf-modal .modal-title, .qf-modal .modal-msg { text-align: center; }
.qf-row { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 6px; align-items: center; margin-bottom: 6px; }
.qf-head { font-size: 0.8rem; color: var(--subtext-color); text-align: center; font-weight: 700; }
.qf-lbl { font-weight: 700; font-size: 0.9rem; }
.qf-in { margin-top: 0 !important; padding: 8px !important; text-align: center; }
.qf-note { margin-top: 10px; font-size: 0.82rem; color: var(--subtext-color); line-height: 1.7; }
.rules-block { margin-top: 16px; text-align: start; }
.rules-block h4 { border: none; padding: 0; margin: 0 0 6px; }
.rules-block li { color: var(--subtext-color); font-size: 0.9rem; line-height: 1.85; margin-inline-start: 20px; }
.rules-table-wrap { overflow-x: auto; }
.rules-table-wrap .star-table td:last-child { color: inherit; font-weight: 600; }
.rules-table-wrap .star-table td:first-child { font-weight: 800; }
.rules-table-wrap .star-table td { font-size: 0.82rem; }

</style>
</head>

};
const GRADES = ['prep','sec1','sec2','sec3'], TRACKS = ['eng','arts','med','biz'];
const PREP_SUBJECTS = ['arabic_cal','english','math','science','social'];
const SEC1_CORE = ['arabic','english','math','integrated','egy_history','logic'];      // تدخل في المجموع
const SEC1_PASSFAIL = ['religion','second_lang','cs_ai'];                              // ناجح/راسب فقط
const SEC2_COMMON = ['arabic','history','english'];
const SEC2_ELECTIVES = { eng:['programming','chemistry'], arts:['french','german','philosophy'], med:['math','physics'], biz:['accounting','business'] };
const SEC3_BY_TRACK = { med:['biology','chemistry'], eng:['math','physics'], biz:['economics','math'], arts:['geography','statistics'] };
const LEGACY_SUBJECTS = ['arabic','programming','history','english'];                  // للحسابات القديمة التي لم تحدد صفها
function computeSubjects(grade, track, elective){
  const mk = (keys, tag) => keys.map(k => ({key:k, tag: tag || ''}));
  if (grade === 'prep') return mk(PREP_SUBJECTS);
  if (grade === 'sec1') return [...mk(SEC1_CORE), ...mk(SEC1_PASSFAIL, 'pf')];
  if (grade === 'sec2') { const l = mk(SEC2_COMMON); if (track && SEC2_ELECTIVES[track] && SEC2_ELECTIVES[track].includes(elective)) l.push({key:elective, tag:''}); return l; }
  if (grade === 'sec3') { const l = mk(['religion'], 'pf'); if (track && SEC3_BY_TRACK[track]) l.push(...mk(SEC3_BY_TRACK[track], 'adv')); return l; }
  return mk(LEGACY_SUBJECTS);
}
function mySubjects(){ return computeSubjects(userGrade, userTrack, userElective).map(x => ({...x, ...(SUBJECTS[x.key] || {icon:'📚', color:'#6366f1'})})); }
function fillSubjectSelects(){
  const fill = (id, keys) => { const el = $(id); if (!el) return; const prev = el.value; el.innerHTML = keys.map(k => `<option value="${k}">${esc(subjName(k))}</option>`).join(''); if (keys.includes(prev)) el.value = prev; };
  fill('todo-subject-select', mySubjects().map(x => x.key)); fill('exam-subject', Object.keys(SUBJECTS));
}
function renderGradeBar(){
  const bar = $('grade-bar'), sm = $('grade-summary'), btn = $('grade-edit-btn'); if (!bar) return;
  bar.style.display = currentUser === 'admin' ? 'none' : '';
  if (!userGrade) { sm.textContent = t('grade_unset'); btn.textContent = t('grade_set_btn'); }
  else { sm.textContent = '🎓 ' + t('grade_' + userGrade) + (userTrack ? ' • ' + t('track_' + userTrack) : ''); btn.textContent = t('grade_change_btn'); }
}
function subjBadges(by){
  const groups = [['ar','📖',['arabic','arabic_cal']], ['pr','💻',['programming']], ['hi','🏛️',['history','egy_history']], ['en','🇬🇧',['english']]], mine = mySubjects().map(x => x.key);
  return groups.filter(g => g[2].some(k => mine.includes(k))).map(g => [g[0], g[1], g[2].reduce((a, k) => a + (by[k] || 0), 0) >= 600]);
}
// ---- نموذج اختيار الصف/المسار (يُستخدم في التسجيل وفي شاشة «صفي الدراسي») ----
const acad = { reg: {grade:'', track:'', elective:''}, prof: {grade:'', track:'', elective:''} };
function acadError(st){ if (!st.grade) return 'err_grade'; if ((st.grade === 'sec2' || st.grade === 'sec3') && !st.track) return 'err_track'; if (st.grade === 'sec2' && !st.elective) return 'err_elective'; return null; }
function acadSet(p, field, val){ const st = acad[p]; st[field] = val; if (field === 'grade') { st.track = ''; st.elective = ''; } if (field === 'track') st.elective = ''; renderAcademic(p); }
function renderAcademic(p){
  const box = $(p + '-academic'); if (!box) return; const st = acad[p];
  const opts = (list, cur) => list.map(([v, l]) => `<option value="${v}" ${v === cur ? 'selected' : ''}>${esc(l)}</option>`).join('');
  let h = `<div class="form-group"><label>${t('label_grade')}</label><select class="input-field" onchange="acadSet('${p}','grade',this.value)">${opts([['', t('grade_choose')], ...GRADES.map(g => [g, t('grade_' + g)])], st.grade)}</select></div>`;
  if (st.grade === 'sec2' || st.grade === 'sec3') h += `<div class="form-group"><label>${t('label_track')}</label><select class="input-field" onchange="acadSet('${p}','track',this.value)">${opts([['', t('track_choose')], ...TRACKS.map(k => [k, t('track_' + k)])], st.track)}</select></div>`;
  if (st.grade === 'sec2' && st.track) h += `<div class="form-group"><label>${t('label_elective')}</label><select class="input-field" onchange="acadSet('${p}','elective',this.value)">${opts([['', t('elective_choose')], ...SEC2_ELECTIVES[st.track].map(k => [k, subjName(k)])], st.elective)}</select></div>`;
  if (st.grade === 'sec1') h += `<div class="grade-note">${t('note_sec1')}</div>`;
  if (st.grade && !acadError(st)) h += `<div class="subj-preview"><span class="lbl">${t('preview_title')}</span>${computeSubjects(st.grade, st.track, st.elective).map(x => `<span class="subj-chip">${(SUBJECTS[x.key] || {}).icon || '📚'} ${esc(subjName(x.key))}${x.tag ? ` <span class="subj-tag ${x.tag}">${t('tag_' + x.tag)}</span>` : ''}</span>`).join('')}</div>`;
  box.innerHTML = h;
}
function renderSignupGuide(){ const b = $('signup-guide'); if (b) b.innerHTML = `<h4>${t('reg_guide_title')}</h4><ul>${['reg_g1','reg_g2','reg_g3','reg_g4'].map(k => `<li>${t(k)}</li>`).join('')}</ul>`; }
const isValidEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e || '');
function openProfile(){ if (currentUser === 'admin') return; acad.prof = {grade: userGrade || '', track: userTrack || '', elective: userElective || ''}; renderAcademic('prof'); showScreen('profile-screen'); }
function saveProfile(){
  const st = acad.prof, err = acadError(st); if (err) return uiAlert(t(err), {icon:'🎓'});
  userGrade = st.grade; userTrack = (st.grade === 'sec2' || st.grade === 'sec3') ? st.track : null; userElective = st.grade === 'sec2' ? st.elective : null;
  saveUserData(); renderSubjectsGrid(); fillSubjectSelects(); renderGradeBar(); renderBadges(); renderStats(); toast(t('profile_saved'), 'success'); showScreen('subject-selection');
}

function openDialog(o){
  return new Promise(resolve => {
    const ov = document.createElement('div'); ov.className = 'modal-overlay';
    const msgHtml = o.html !== undefined ? o.html : (o.message || '').replace(/\n/g,'<br>');
    ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><div class="modal-icon">${o.icon||'ℹ️'}</div>${o.title?`<h3 class="modal-title">${esc(o.title)}</h3>`:''}<div class="modal-msg">${msgHtml}</div><div class="modal-actions"></div></div>`;
    const modal = ov.querySelector('.modal'), actions = ov.querySelector('.modal-actions');
    let inputEl = null, errEl = null;
    if (o.input) {
      const wrap = document.createElement('div'); wrap.className = 'modal-input-wrap';
      if (o.input.label) { const l = document.createElement('label'); l.textContent = o.input.label; wrap.appendChild(l); }
      inputEl = document.createElement('input'); inputEl.className = 'input-field'; inputEl.type = o.input.type || 'text';
      if (o.input.value !== undefined) inputEl.value = o.input.value;
      if (o.input.placeholder) inputEl.placeholder = o.input.placeholder;
      if (o.input.min !== undefined) inputEl.min = o.input.min;
      if (o.input.max !== undefined) inputEl.max = o.input.max;
      wrap.appendChild(inputEl);
      errEl = document.createElement('div'); errEl.className = 'modal-error';
      if (o.input.chips) { const c = document.createElement('div'); c.className = 'chips'; o.input.chips.forEach(ch => { const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = ch.label; b.onclick = () => { inputEl.value = ch.value; errEl.textContent = ''; inputEl.focus(); }; c.appendChild(b); }); wrap.appendChild(c); }
      wrap.appendChild(errEl); modal.insertBefore(wrap, actions);
    }
    let done = false;
    const close = res => { if (done) return; done = true; document.removeEventListener('keydown', onKey); ov.classList.add('closing'); setTimeout(() => ov.remove(), 160); resolve(res); };
    const buttons = o.buttons || [{label: t('ok'), cls: 'primary-btn', value: true}];
    const els = buttons.map(b => {
      const el = document.createElement('button'); el.type = 'button'; el.className = 'btn ' + (b.cls || 'secondary-btn'); el.textContent = b.label;
      el.onclick = () => {
        const val = inputEl ? inputEl.value : null;
        if (b.validate && o.validate) { const err = o.validate(val); if (err) { errEl.textContent = err; inputEl && inputEl.focus(); return; } }
        close({value: b.value, input: val});
      };
      actions.appendChild(el); return el;
    });
    function onKey(e){
      if (e.key === 'Escape' && o.dismissible !== false) close({value: null, input: null});
      else if (e.key === 'Enter' && inputEl && document.activeElement === inputEl) { const i = buttons.findIndex(b => b.validate); if (i >= 0) els[i].click(); }
    }
    document.addEventListener('keydown', onKey);
    if (o.dismissible !== false) ov.addEventListener('mousedown', e => { if (e.target === ov) close({value: null, input: null}); });
    $('modal-root').appendChild(ov);
    setTimeout(() => { if (inputEl) { inputEl.focus(); inputEl.select(); } else { els[0].focus(); } }, 30);
  });
}

function startTask(subjectKey, mins, type, topic = ""){
  isBreakSession = isBreakType(type); selectedSubjectKey = subjectKey; sessionType = type; currentTopic = topic; allottedMinutes = mins;
  secondsElapsed = 0; totalSecondsRemaining = mins * 60; isPaused = false; sessionActive = true; lastResult = null; lastTickTs = Date.now();
  pausedSecs = 0; awaySecs = 0; pauseCount = 0; awayStart = 0; window._breakCounted = false;
  showScreen('timer-screen'); renderTimerTexts(); updateTimerDisplay();

function tick(){
  if (!sessionActive) return;
  const now = Date.now();
  if (isPaused) { pausedSecs += (now - lastTickTs) / 1000; lastTickTs = now; return; }
  const d = Math.floor((now - lastTickTs) / 1000); if (d < 1) return;
  lastTickTs += d * 1000; secondsElapsed += d; totalSecondsRemaining = Math.max(0, totalSecondsRemaining - d);
  updateTimerDisplay(); updateFinishHint();
  if (totalSecondsRemaining <= 0) finishTask(true);
}
function updateTimerDisplay(){ $('timer-display').textContent = mmss(totalSecondsRemaining); }

function updateFinishHint(){

  if (isBreakSession) { gate.classList.add('hidden'); btn.classList.remove('is-locked'); return; }
  gate.classList.remove('hidden');

  fill.style.width = (ready ? 100 : Math.min(100, secondsElapsed / MIN_FINISH_SECONDS * 100)) + '%';
  gate.classList.toggle('ready', ready); btn.classList.toggle('is-locked', !ready);

}
function togglePauseTimer(){

// ==================== معادلة النجوم الأصلية - بدون تغيير ====================
// minutesStudied = ceil(secondsStudied/60) ، earned = floor(minutesStudied * 1.5) ، ×2 مع النجمة الذهبية
function calculateStarsOriginal(secondsStudied){
  const minutesStudied = Math.ceil(secondsStudied / 60);
  let earnedPoints = Math.floor(minutesStudied * 1.5);
  if (doubleStarsUntil && Date.now() < doubleStarsUntil) earnedPoints *= 2;
  return { minutesStudied, earnedPoints };
}

// ==================== إنهاء وحفظ الجلسة (مع تنبيه الـ 5 دقائق) ====================
async function finishTask(isTimeExpired = false){
  if (!sessionActive) return;
  const allottedSecs = allottedMinutes * 60;
  const secondsStudied = Math.min(secondsElapsed, allottedSecs);
  if (!isTimeExpired && !isBreakSession && secondsStudied < MIN_FINISH_SECONDS && allottedSecs >= MIN_FINISH_SECONDS) {
    const remaining = MIN_FINISH_SECONDS - secondsStudied;
    await openDialog({icon:'⏳', title: t('dlg_5min_title'), html: t('dlg_5min_msg', {t: mmss(remaining)}).replace(/\n/g,'<br>'), buttons: [{label: t('btn_keep_going'), cls:'primary-btn', value:true}]});
    return;
  }
  sessionActive = false; clearInterval(timerInterval);
  let returned = 0;
  if (isBreakSession) { if (sessionType === T_GAME) totalGameSecs += secondsStudied; else totalWatchSecs += secondsStudied; window._breakCounted = true; }
  if (isBreakSession && !isTimeExpired) {
    returned = Math.floor(totalSecondsRemaining / 60);
    if (returned > 0) { if (sessionType === T_GAME) gameTimeMins += returned; else watchTimeMins += returned; }
  }
  let earnedPoints = 0, starMinutes = 0;
  if (!isBreakSession) {
    const calc = calculateStarsOriginal(secondsStudied);
    earnedPoints = calc.earnedPoints; starMinutes = calc.minutesStudied;
    totalPoints += earnedPoints; totalStudyMinutes += calc.minutesStudied;
  }
  saveHistoryRecord({ subject: selectedSubjectKey, type: sessionType, topic: currentTopic, minutes: allottedMinutes, timeTakenSeconds: secondsStudied, points: earnedPoints, completedAt: new Date().toISOString(), date: new Date().toLocaleDateString('en-GB') });
  updateUI();
  lastResult = { expired: isTimeExpired, brk: isBreakSession, type: sessionType, subject: selectedSubjectKey, topic: currentTopic, secs: secondsStudied, stars: earnedPoints, starMins: starMinutes, returned };
  if (!isBreakSession) {
    if (sessionType === T_HW) lastResult.rank = await processRankedSession(secondsStudied, allottedSecs);
    else lastResult.xpOnly = awardStudyXp(secondsStudied);
    updateUI(); renderRank();
  }
  renderResult(); showScreen('result-screen'); stopAmbient(); if (zenMode) toggleZenMode();
  renderBadges(); renderStats(); renderTodo(); renderSubjectsGrid(); toast(t('saved_toast'), 'success');
}
function renderResult(){
  const r = lastResult; if (!r) return;
  $('result-title').textContent = r.brk ? t('res_title_break') : (r.expired ? t('res_title_expired') : t('res_title_success', {type: typeLabel(r.type)}));
  const timeText = fmtDur(r.secs); let html;
  if (r.brk) {
    html = `${t('res_break_msg', {type: typeLabel(r.type)})}<br><br><span style="font-size:1.3rem; color:#6366f1;">${timeText}</span>`;
    if (r.returned > 0) html += `<br><br><span style="color:var(--success-color); font-weight:700;">${t('res_returned', {m: r.returned})}</span>`;
  } else {
    const topic = displayTopic(r.topic);
    html = `${t('res_msg', {type: typeLabel(r.type), subject: subjName(r.subject), topic: topic ? '(' + esc(topic) + ')' : ''})}<br><br><span style="font-size:1.3rem; color:#6366f1;">${timeText}</span>`;
    html += r.stars > 0 ? `<br><br><span style="color:#f59e0b; font-weight:bold;">${t('res_stars', {pts: r.stars, m: r.starMins})}</span>` : `<br><br><span style="color:var(--subtext-color);">${t('res_no_stars')}</span>`;
  }
  html += rankResultHtml(r);
  $('result-message').innerHTML = html;
}

async function cancelTask(){
  if (!sessionActive) return;
  const brk = isBreakSession, returned = brk ? Math.floor(totalSecondsRemaining / 60) : 0;
  const ok = await uiConfirm(t(brk ? 'cancel_msg_break' : 'cancel_msg_study', {m: returned}).replace(/\n/g,'<br>'), {html:true, icon:'⚠️', title: t('cancel_title'), yes: t('cancel_yes'), no: t('cancel_no'), danger:true});

  updateUI(); stopAmbient(); if (zenMode) toggleZenMode(); showScreen('subject-selection');
  toast(brk ? t('cancelled_break_toast', {m: returned}) : t('cancelled_toast'), 'warn');
}

// ==================== وقت اللعب / المشاهدة ====================
async function useRewardTime(kind){
  if (sessionActive) return;
  const isGame = kind === 'gaming', avail = isGame ? gameTimeMins : watchTimeMins, shopId = isGame ? 1 : 2;
  if (avail <= 0) {
    const price = DEFAULT_SHOP_ITEMS.find(i => i.id === shopId).price, canBuy = totalPoints >= price;
    const buttons = [];
    if (canBuy) buttons.push({label: t('buy_now', {price}), cls:'success-btn', value:'buy'});
    buttons.push({label: t('go_store'), cls:'primary-btn', value:'store'}, {label: t('close'), cls:'secondary-btn', value:'close'});
    const r = await openDialog({icon: isGame ? '🎮' : '🎬', title: t(isGame ? 'no_game_title' : 'no_watch_title'), html: t(isGame ? 'no_game_msg' : 'no_watch_msg', {price, stars: totalPoints}).replace(/\n/g,'<br>'), buttons});
    if (r.value === 'buy') { if (await buyShopItem(shopId, false)) return useRewardTime(kind); }
    else if (r.value === 'store') openStore();
    return;
  }
  const chips = [10, 15, 30].filter(v => v < avail).map(v => ({label: String(v), value: v})); chips.push({label: t('chip_all', {m: avail}), value: avail});
  const r = await openDialog({ icon: isGame ? '🎮' : '🎬', title: t(isGame ? 'ask_game_title' : 'ask_watch_title'), html: t('ask_minutes_msg', {m: avail}),
    input: {type:'number', label: t('label_minutes'), value: Math.min(avail, 30) === avail ? avail : 30, min:1, max: avail, chips},
    validate: v => { const n = Number(v); return (Number.isInteger(n) && n >= 1 && n <= avail) ? null : t('err_minutes', {m: avail}); },
    buttons: [{label: t('btn_cancel'), cls:'secondary-btn', value:null}, {label: t('btn_begin'), cls:'success-btn', value:'go', validate:true}] });
  if (r.value !== 'go' || sessionActive) return;
  const mins = parseInt(r.input);
  if (isGame) gameTimeMins -= mins; else watchTimeMins -= mins;
  updateUI(); startTask(kind, mins, isGame ? T_GAME : T_WATCH, isGame ? '@game' : '@watch');
}

  const historyRef = isAdmin ? null : db.collection("users").doc(currentUser).collection("history").doc();
  const history = getLocalHistory(); history.unshift({ ...record, id: historyRef ? historyRef.id : `admin_${Date.now()}_${Math.random().toString(36).slice(2)}` }); history.splice(30);
  setLocalHistory(history); renderHistoryItems(history); if (isAdmin) return;
  historyRef.set({ ...record, createdAt: firebase.firestore.FieldValue.serverTimestamp() }).catch(e => console.error(e));
}
function renderHistory(){
  if (!currentUser) return; renderHistoryItems(getLocalHistory()); if (currentUser === 'admin') return;
  const who = currentUser;
  db.collection("users").doc(who).collection("history").orderBy("createdAt","desc").limit(30).get().then(snap => {
    if (currentUser !== who) return;
    const history = snap.docs.map(d => ({ ...d.data(), id: d.id })); setLocalHistory(history); renderHistoryItems(history); renderBadges(); renderStats(); renderSubjectsGrid();

function getStoredHistoryMap(){ try { const s = JSON.parse(localStorage.getItem('homework_history') || '{}'); if (Array.isArray(s)) return { [currentUser]: s }; return s && typeof s === 'object' ? s : {}; } catch { return {}; } }

async function clearAllHistory(){

function initMiniGame(){

// ==================== مواقيت الصلاة (القاهرة - aladhan method 5) ====================
const PRAYERS = [['Fajr','🌅'], ['Dhuhr','☀️'], ['Asr','🌤️'], ['Maghrib','🌙'], ['Isha','🌃']];
let prayerNextKey = null, prayerNextWrapped = false;
function parseHM(s){ const m = /(\d{1,2}):(\d{2})/.exec(s || ''); return m ? [+m[1], +m[2]] : [0, 0]; }
function fmt12(h, m){ const per = h >= 12 ? t('pm') : t('am'); return `${h % 12 || 12}:${pad2(m)} ${per}`; }
async function fetchPrayerTimes(){
  try {
    const res = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Cairo&country=Egypt&method=5'); const data = await res.json();
    if (data.code !== 200) throw new Error('bad response');
    prayerTimings = data.data.timings; prayerError = false; prayerDate = new Date().toDateString();
  } catch (e) { console.error(e); prayerError = true; setTimeout(fetchPrayerTimes, 60000); }
  renderPrayer();
}
function renderPrayer(){
  const box = $('prayer-times-list'), info = $('next-prayer-info'); if (!box || !info) return;
  if (!prayerTimings) { box.innerHTML = ''; info.textContent = t(prayerError ? 'prayer_error' : 'prayer_loading'); return; }
  const now = new Date(), cur = now.getHours() * 60 + now.getMinutes(); let next = null;
  for (const [k] of PRAYERS) { const [h, m] = parseHM(prayerTimings[k]); if (h * 60 + m > cur) { next = k; break; } }
  prayerNextWrapped = !next; if (!next) next = 'Fajr'; prayerNextKey = next;
  box.innerHTML = PRAYERS.map(([k, icon]) => { const [h, m] = parseHM(prayerTimings[k]); return `<div class="prayer-item ${k === next ? 'next-prayer' : ''}" data-next="${esc(t('prayer_next_label'))}"><span class="prayer-icon">${icon}</span><div class="prayer-name">${t('pr_' + k)}</div><div class="prayer-time">${fmt12(h, m)}</div><div class="prayer-countdown" data-prayer="${k}"></div></div>`; }).join('');
  const [nh, nm] = parseHM(prayerTimings[next]); let diff = nh * 60 + nm - cur; if (diff <= 0) diff += 1440;
  const left = '<span id="next-prayer-left">' + (Math.floor(diff / 60) > 0 ? t('left_hm', {h: Math.floor(diff / 60), m: diff % 60}) : t('left_m', {m: diff % 60})) + '</span>';
  info.innerHTML = t('prayer_next_info', {icon: PRAYERS.find(p => p[0] === next)[1], name: t('pr_' + next), left, at: fmt12(nh, nm)});
  tickPrayerCountdown(true);
}
// عدّاد تنازلي حي (كل ثانية) لكل صلاة قادمة
function fmtHMS(sec){ sec = Math.max(0, Math.floor(sec)); return `${pad2(Math.floor(sec / 3600))}:${pad2(Math.floor(sec % 3600 / 60))}:${pad2(sec % 60)}`; }
function tickPrayerCountdown(noRender){
  if (!prayerTimings) return;
  const nodes = document.querySelectorAll('.prayer-countdown'); if (!nodes.length) return;
  const now = Date.now(); let needRender = false;
  nodes.forEach(el => {
    const k = el.dataset.prayer, [h, m] = parseHM(prayerTimings[k]), d = new Date(); d.setHours(h, m, 0, 0);
    let ms = d.getTime() - now;
    if (ms <= 0) {
      if (k === prayerNextKey && prayerNextWrapped) ms += 86400000;          // فجر الغد
      else if (k === prayerNextKey) { needRender = true; return; }           // حان الموعد: حدّث التمييز
      else { const pt = t('prayer_passed'); if (el.className !== 'prayer-countdown passed') el.className = 'prayer-countdown passed'; if (el.textContent !== pt) el.textContent = pt; return; }
    }
    const txt = fmtHMS(Math.ceil(ms / 1000));
    if (el.className !== 'prayer-countdown') el.className = 'prayer-countdown';
    if (el.textContent !== txt) el.textContent = txt;
    if (k === prayerNextKey) { const l = document.getElementById('next-prayer-left'); if (l && l.textContent !== txt) l.textContent = txt; }
  });
  if (needRender && !noRender) renderPrayer();
}

// ==================== نظام الرتب والمستويات (Rank System) ====================
// رتبة الجلسة (F → SSS) تُحسب لجلسات «الواجب 120 دقيقة» من عدد الأسئلة والدقة والتركيز.
const RANKS = ['F','D','C','B','A','S','SS','SSS'];
const RANK_MIN_UNITS = [0, 14, 20, 30, 45, 60, 80, 99];   // سؤال الاختيار = 1 نقطة، المقالي = ESSAY_WEIGHT
const ESSAY_WEIGHT = 3.3;
const RANK_RP = {F:-20, D:-12, C:-5, B:5, A:15, S:25, SS:35, SSS:45};
const RANK_XP_MULT = {F:0.3, D:0.5, C:0.7, B:0.85, A:1, S:1.2, SS:1.35, SSS:1.5};
const RANK_STARS = {SSS:120, SS:80, S:50, A:25, B:0, C:0, D:0, F:0};
const RANK_COLORS = {SSS:'#fbbf24', SS:'#f59e0b', S:'#a855f7', A:'#3b82f6', B:'#10b981', C:'#94a3b8', D:'#78716c', F:'#ef4444'};
const XP_W = { mcq:{e:2, m:4, h:10}, essay:{e:5, m:10, h:25} };   // المتوسط ضعف السهل، والصعب الأعلى
const ROMAN = ['I','II','III','IV','V'];
const MAX_LEVEL = 999;

// السلم التنافسي: [المعرّف، الأيقونة، اللون، عدد الأقسام، نقاط الرتبة لعبور القسم]
const TIER_DEFS = [['warrior','🛡️','#b45309',1,100], ['elite','🗡️','#94a3b8',1,150], ['master','🏅','#eab308',1,200], ['gm','💠','#3b82f6',5,250],
  ['epic','🔮','#a855f7',5,300], ['legend','👑','#ec4899',5,350], ['mythic','🔥','#ef4444',5,400], ['honor','🌟','#f97316',1,500], ['glory','💫','#fb923c',1,600], ['immortal','☄️','#22d3ee',1,0]];
const TIERS = (() => { const out = []; let acc = 0; TIER_DEFS.forEach(([id, icon, color, div, step]) => { for (let i = 1; i <= div; i++) { out.push({id, icon, color, div: div > 1 ? i : 0, at: acc}); acc += step; } }); return out; })();
const TI = id => TIERS.findIndex(x => x.id === id);
const GM_IDX = TI('gm');
function tierName(i){ const x = TIERS[i]; return t('tier_' + x.id) + (x.div ? ' ' + ROMAN[x.div - 1] : ''); }
function tierIndexFor(rp){ let k = 0; for (let i = 0; i < TIERS.length; i++) if (rp >= TIERS[i].at) k = i; return k; }

// المستوى 0–999: تكلفة المستوى L = 100 + 2L (تزداد صعوبة كلما ارتفعت)، المجموع التراكمي = L² + 101L
const xpForLevel = L => L * L + 101 * L;
function levelFromXp(xp){
  xp = Math.max(0, xp || 0);
  let L = Math.floor((-101 + Math.sqrt(10201 + 4 * xp)) / 2);
  while (L < MAX_LEVEL && xpForLevel(L + 1) <= xp) L++;
  while (L > 0 && xpForLevel(L) > xp) L--;
  return Math.min(MAX_LEVEL, Math.max(0, L));
}
const sgn = n => (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n);

function defaultRank(){
  return { xp:0, rp:0, season:'', peakTier:0, maxTier:0, ranked:0, rc:{}, totalQ:0, mcqTotal:0, essayTotal:0, hardCorrect:0, perfect:0, perfect100:0, focusGood:0, noPause:0, efficient:0,
    streakA:0, streakS:0, bestStreakA:0, bestStreakS:0, seasonResets:0, seasonsPlayed:0, comeback:false, lastRank:'', xpBoostUntil:0, shields:0, waivers:0, rpBoost:0, seasonGuards:0, coupon:0, streakGuards:0, focusCharm:0, badges:{}, log:[], past:[] };
}
function normalizeRank(r){
  const d = defaultRank(); if (!r || typeof r !== 'object') return d;
  const o = {...d, ...r}; o.rc = {...(r.rc || {})}; o.badges = {...(r.badges || {})};
  o.log = Array.isArray(r.log) ? r.log.slice(0, 60) : []; o.past = Array.isArray(r.past) ? r.past.slice(0, 12) : [];
  o.xp = Math.max(0, +o.xp || 0); o.rp = Math.max(0, +o.rp || 0); o.maxTier = Math.max(+o.maxTier || 0, tierIndexFor(o.rp));
  return o;
}
function pushLog(type, data){ rankState.log.unshift({t: type, at: Date.now(), ...data}); rankState.log.splice(60); }

function seasonId(d = new Date()){ return d.getFullYear() + '-S' + (Math.floor(d.getMonth() / 3) + 1); }
function seasonEnd(d = new Date()){ return new Date(d.getFullYear(), (Math.floor(d.getMonth() / 3) + 1) * 3, 1); }
function checkSeason(){
  if (!currentUser || currentUser === 'admin') return;
  const cur = seasonId(), s = rankState; if (s.season === cur) return;
  const first = !s.season; let reset = false;
  if (!first) {
    const ti = tierIndexFor(s.rp);
    s.past.unshift({s: s.season, peak: s.peakTier, final: ti, rp: s.rp}); s.past.splice(12); s.seasonsPlayed++;
    if (ti >= GM_IDX) { if (s.seasonGuards > 0) { s.seasonGuards--; toast(t('season_guarded'), 'success'); } else { s.rp = TIERS[GM_IDX].at; s.seasonResets++; reset = true; } }
    pushLog('season', {season: cur, reset});
    toast(t(reset ? 'season_reset' : 'season_new', {s: cur}), 'success');
  }
  s.season = cur; s.peakTier = tierIndexFor(s.rp);
}

function evaluateBadges(){
  if (!currentUser || currentUser === 'admin') return [];
  const lvl = levelFromXp(rankState.xp), fresh = [];
  BADGES.forEach(b => {
    if (rankState.badges[b.id]) return;
    let ok = false; try { ok = !!b.fn(rankState, lvl); } catch {}

}

function openQuestionForm(){
  return new Promise(resolve => {
    const el = Math.max(1, secondsElapsed), wasted = (pausedSecs + awaySecs) * (rankState.focusCharm > 0 ? 0.5 : 1), focus = Math.max(0, Math.min(1, 1 - wasted / el));
    const ov = document.createElement('div'); ov.className = 'modal-overlay';

    ov.innerHTML = `<div class="modal qf-modal" role="dialog" aria-modal="true"><div class="modal-icon">📝</div><h3 class="modal-title">${t('qf_title')}</h3><div class="modal-msg">${t('qf_intro')}</div>
      <div style="margin-top:14px;"><div class="qf-row qf-head"><span></span><span>${t('qf_easy')}</span><span>${t('qf_medium')}</span><span>${t('qf_hard')}</span></div>${row('mcq', t('qf_mcq'))}${row('essay', t('qf_essay'))}</div>
      <div class="modal-input-wrap"><label>${t('qf_correct')} <b id="qf-total-lbl">0</b></label><input type="number" min="0" value="0" inputmode="numeric" class="input-field" id="qf-correct"><div class="modal-error" id="qf-err"></div></div>
      <p class="qf-note">${t('qf_focus', {p: Math.round(focus * 100), pa: Math.round(pausedSecs / 60), aw: Math.round(awaySecs / 60)})}</p>
      <div class="modal-actions"><button type="button" class="btn secondary-btn" id="qf-skip">${t('qf_skip')}</button><button type="button" class="btn success-btn" id="qf-ok">${t('qf_submit')}</button></div></div>`;
    const ins = [...ov.querySelectorAll('.qf-in')], corr = ov.querySelector('#qf-correct'), err = ov.querySelector('#qf-err');
    const num = i => Math.max(0, Math.min(999, parseInt(i.value) || 0));
    const total = () => ins.reduce((s, i) => s + num(i), 0);
    const upd = () => { ov.querySelector('#qf-total-lbl').textContent = total(); err.textContent = ''; };
    ins.forEach(i => i.addEventListener('input', upd)); corr.addEventListener('input', upd);
    ov.querySelector('#qf-skip').onclick = () => { ov.remove(); resolve(null); };
    ov.querySelector('#qf-ok').onclick = () => {
      const tt = total(), c = Math.max(0, parseInt(corr.value) || 0);
      if (c > tt) { err.textContent = t('qf_err_correct', {n: tt}); return; }
      const f = {mcq:{e:0,m:0,h:0}, essay:{e:0,m:0,h:0}, correct: c}; ins.forEach(i => f[i.dataset.k][i.dataset.d] = num(i));
      ov.remove(); resolve(f);
    };
    $('modal-root').appendChild(ov); setTimeout(() => ins[0].focus(), 30);
  });
}

// ---- حساب نتيجة الجلسة ----
function computeRankedResult(f, elapsed, allotted){
  const cnt = k => f[k].e + f[k].m + f[k].h;
  const mcqN = cnt('mcq'), essN = cnt('essay'), total = mcqN + essN;
  const correct = Math.min(f.correct, total), acc = total ? correct / total : 0;
  const units = mcqN + essN * ESSAY_WEIGHT;
  let idx = 0; RANK_MIN_UNITS.forEach((m, i) => { if (units >= m) idx = i; });
  const charm = rankState.focusCharm > 0, wasted = (pausedSecs + awaySecs) * (charm ? 0.5 : 1), focus = elapsed > 0 ? Math.max(0, Math.min(1, 1 - wasted / elapsed)) : 1;
  const accDrop = total > 0 ? (acc < 0.4 ? 2 : acc < 0.6 ? 1 : 0) : 0, focDrop = (total > 0 && focus < 0.6) ? 1 : 0;
  idx = Math.max(0, idx - accDrop - focDrop);
  const rank = RANKS[idx];
  let raw = 0; ['mcq','essay'].forEach(k => ['e','m','h'].forEach(d => raw += f[k][d] * XP_W[k][d]));
  const xpBase = Math.round(raw * acc * RANK_XP_MULT[rank]);
  const focusBonus = (total > 0 && focus >= 0.95 && elapsed >= allotted * 0.95) ? Math.round(xpBase * 0.2) : 0;
  const effBonus = (allotted - elapsed >= 600 && idx >= 4 && acc >= 0.85) ? Math.round(xpBase * 0.15) : 0;
  const wastedMin = wasted / 60, wastePen = wastedMin > 3 ? Math.round((wastedMin - 3) * 1.5) : 0;
  const wrongPen = total - correct;
  const easyN = f.mcq.e + f.essay.e, easyPen = (total > 0 && acc < 0.6 && easyN / total >= 0.5) ? 10 : 0;
  const earlyPen = (elapsed < allotted * 0.5 && idx < 3) ? 25 : 0;
  const xp = xpBase + focusBonus + effBonus - wastePen - wrongPen - easyPen - earlyPen;
  return { rank, idx, units, mcqN, essN, total, correct, acc, focus, accDrop, focDrop, xpBase, focusBonus, effBonus, wastePen, wrongPen, easyPen, earlyPen, xp, rp: RANK_RP[rank], stars: RANK_STARS[rank],
    hardCorrect: Math.round((f.mcq.h + f.essay.h) * acc), pauseCount, charm, subject: selectedSubjectKey };
}
function applyRankedResult(res){
  const s = rankState, oldLevel = levelFromXp(s.xp), oldTier = tierIndexFor(s.rp);
  if (res.charm) s.focusCharm = Math.max(0, (s.focusCharm || 0) - 1);
  // تأثيرات المتجر: ممحاة الأخطاء ← بوست الخبرة ← درع الرتبة / معزّز الرتبة
  const pens = res.wastePen + res.wrongPen + res.easyPen + res.earlyPen;
  if (pens > 0 && s.waivers > 0) { s.waivers--; res.xp += pens; res.waived = pens; res.wastePen = res.wrongPen = res.easyPen = res.earlyPen = 0; }
  if (res.xp > 0 && s.xpBoostUntil > Date.now()) { res.xp *= 2; res.boosted = true; }
  if (res.rp < 0 && s.shields > 0) { s.shields--; res.shielded = -res.rp; res.rp = 0; }
  else if (res.rp > 0 && s.rpBoost > 0) { s.rpBoost--; res.rp = Math.round(res.rp * 1.5); res.rpBoosted = true; }
  s.xp = Math.max(0, s.xp + res.xp); s.rp = Math.max(0, s.rp + res.rp);
  const newLevel = levelFromXp(s.xp), newTier = tierIndexFor(s.rp);
  s.ranked++; s.rc[res.rank] = (s.rc[res.rank] || 0) + 1; s.totalQ += res.total; s.mcqTotal += res.mcqN; s.essayTotal += res.essN; s.hardCorrect += res.hardCorrect;
  if (res.total >= 20 && res.acc >= 0.95) s.perfect++;
  if (res.total >= 30 && res.acc >= 1) s.perfect100++;
  if (res.total > 0 && res.focus >= 0.95) s.focusGood++;
  if (res.total > 0 && res.pauseCount === 0 && res.focus >= 0.9) s.noPause++;
  if (res.effBonus > 0) s.efficient++;
  if (res.idx >= 4) { s.streakA++; s.bestStreakA = Math.max(s.bestStreakA, s.streakA); } else s.streakA = 0;
  if (res.idx >= 5) { s.streakS++; s.bestStreakS = Math.max(s.bestStreakS, s.streakS); } else s.streakS = 0;
  if (s.lastRank === 'F' && res.idx >= 4) s.comeback = true;
  s.lastRank = res.rank; s.peakTier = Math.max(s.peakTier, newTier); s.maxTier = Math.max(s.maxTier || 0, newTier);
  totalPoints += res.stars;
  pushLog('session', {subject: res.subject, rank: res.rank, xp: res.xp, rp: res.rp});
  if (newLevel > oldLevel) { pushLog('level', {n: newLevel}); res.levelUp = newLevel; }
  if (newTier > oldTier) { pushLog('tier', {i: newTier}); res.tierUp = newTier; } else if (newTier < oldTier) res.tierDown = newTier;
  res.newBadges = evaluateBadges().map(b => b.id);
}
async function processRankedSession(elapsed, allotted){
  if (awayStart) { awaySecs += (Date.now() - awayStart) / 1000; awayStart = 0; }
  const form = await openQuestionForm(); if (!form) return null;
  const res = computeRankedResult(form, elapsed, allotted); applyRankedResult(res); return res;
}
function awardStudyXp(secs){
  let xp = Math.floor(secs / 60); if (xp <= 0) return null; if (rankState.xpBoostUntil > Date.now()) xp *= 2;
  const s = rankState, oldLevel = levelFromXp(s.xp); s.xp += xp;
  const newLevel = levelFromXp(s.xp), out = {xp};
  if (newLevel > oldLevel) { pushLog('level', {n: newLevel}); out.levelUp = newLevel; }
  out.newBadges = evaluateBadges().map(b => b.id); return out;
}

    case 'lucky_chest': { const n = rollChest(); totalPoints += n; toast(t('ok_chest', {n}), 'success'); return true; }

const XF = { stars: {fee: 0.05, min: 10, cap: 500}, game: {fee: 0.10, min: 5, cap: 120}, watch: {fee: 0.10, min: 5, cap: 120}, item: {fee: 0, min: 1, cap: 5} };
const CONVERT_FEE = 0.20;
let xfTab = 'send', xfBusy = false, xfPreset = null;
const todayKey = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
function normalizeXfer(o){ const r = {day: '', stars: 0, game: 0, watch: 0, item: 0, log: []}; if (o && typeof o === 'object') { r.day = String(o.day || ''); ['stars','game','watch','item'].forEach(k => r[k] = Math.max(0, +o[k] || 0)); r.log = Array.isArray(o.log) ? o.log.slice(0, 20) : []; } return r; }
function xfToday(){ if (xferInfo.day !== todayKey()) { xferInfo.day = todayKey(); xferInfo.stars = xferInfo.game = xferInfo.watch = xferInfo.item = 0; } return xferInfo; }
const xfFee = (kind, amt) => (XF[kind].fee > 0 && amt > 0) ? Math.max(1, Math.ceil(amt * XF[kind].fee)) : 0;
const xfBalance = (kind, itemId) => kind === 'stars' ? totalPoints : kind === 'game' ? gameTimeMins : kind === 'watch' ? watchTimeMins : (inventory[String(itemId)] || 0);
const xfRemaining = kind => Math.max(0, XF[kind].cap - xfToday()[kind]);
function xfMax(kind, itemId){ const bal = xfBalance(kind, itemId), cap = xfRemaining(kind); for (let a = Math.min(bal, cap); a > 0; a--) if (a + xfFee(kind, a) <= bal) return a; return 0; }
function xfWhat(kind, amount, itemId){
  if (kind === 'item') { const it = DEFAULT_SHOP_ITEMS.find(i => i.id === Number(itemId)); return t('xf_w_item', {n: amount, name: it ? itemTitle(it) : '?'}); }
  return t('xf_w_' + kind, {n: amount});
}

function xfPick(n){ $('xf-to').value = n; xfPreview(); }
function xfSetAmount(v){ $('xf-amount').value = v; xfPreview(); }
function xfRead(){
  const kind = $('xf-kind').value, itemId = kind === 'item' ? $('xf-item').value : null, toRaw = $('xf-to').value.trim(), amt = Math.floor(Number($('xf-amount').value) || 0);

  const bal = xfBalance(kind, itemId);
  if (!toRaw) r.err = 'xf_err_to'; else if (toRaw.toLowerCase() === String(currentUser).toLowerCase()) r.err = 'xf_err_self'; else if (list.length && !hit) r.err = 'xf_err_unknown';
  else if (kind === 'item' && !itemId) r.err = 'xf_err_noitem';
  else if (amt < XF[kind].min) r.err = 'xf_err_min'; else if (amt > xfRemaining(kind)) r.err = 'xf_err_cap'; else if (amt + r.fee > bal) r.err = 'xf_err_bal';

}

async function sendTransfer(){

  try {
    const ref = db.collection('users').doc(r.to), snap = await ref.get();
    if (!snap.exists || snap.data().isBanned) return uiAlert(t('xf_err_unknown'), {icon: '🔍'});
    if (r.amt + r.fee > xfBalance(r.kind, r.itemId)) return uiAlert(t('xf_err_bal'), {icon: '⚠️'});
    if (!await uiConfirm(t('xf_confirm', {w: xfWhat(r.kind, r.amt, r.itemId), u: esc(r.to), fee: r.fee}), {html: true, icon: '🔁', title: t('xf_title'), yes: t('xf_send'), no: t('btn_cancel')})) return;
    const refund = () => { if (r.kind === 'stars') totalPoints += r.amt + r.fee; else if (r.kind === 'game') gameTimeMins += r.amt + r.fee; else if (r.kind === 'watch') watchTimeMins += r.amt + r.fee; else addInv(r.itemId, r.amt); };
    if (r.kind === 'stars') totalPoints -= r.amt + r.fee; else if (r.kind === 'game') gameTimeMins -= r.amt + r.fee; else if (r.kind === 'watch') watchTimeMins -= r.amt + r.fee; else takeInv(r.itemId, r.amt);

      b.set(ref.collection('notifications').doc(), {type: 'transfer_in', from: currentUser, kind: r.kind, amount: r.amt, itemId: r.itemId ? Number(r.itemId) : null, read: false, createdAt: now});
      await b.commit();
    } catch (e) { refund(); updateUI(); return uiAlert(t('err_generic', {e: esc(e.message)}), {icon: '📡'}); }
    xfToday()[r.kind] += r.amt; xferInfo.log.unshift({dir: 'out', who: r.to, kind: r.kind, amount: r.amt, fee: r.fee, itemId: r.itemId ? Number(r.itemId) : null, at: Date.now()}); xferInfo.log.splice(20);

// ---------- استلام التحويلات وأوامر الأدمن (تُطبَّق مرة واحدة عبر transaction) ----------
const claimingIds = new Set();
function listenIncoming(u){
  if (incomingUnsub) incomingUnsub();
  incomingUnsub = db.collection('users').doc(u).collection('incoming').where('claimed', '==', false).onSnapshot(snap => {
    if (currentUser !== u) return;
    snap.docChanges().forEach(c => { if (c.type === 'added') claimIncoming(u, c.doc.ref); });
  }, () => {});
}
async function claimIncoming(u, ref){
  if (claimingIds.has(ref.id)) return; claimingIds.add(ref.id);
  try {
    const data = await db.runTransaction(async tx => { const s = await tx.get(ref); if (!s.exists || s.data().claimed) return null; tx.update(ref, {claimed: true}); return s.data(); });
    if (data && currentUser === u) applyIncoming(data);
  } catch (e) { console.error(e); claimingIds.delete(ref.id); }
}
function applyIncoming(x){
  const n = Math.max(0, Math.floor(+x.amount || 0));
  if (x.kind === 'stars') totalPoints += n; else if (x.kind === 'game') gameTimeMins += n; else if (x.kind === 'watch') watchTimeMins += n;
  else if (x.kind === 'item') { if (DEFAULT_SHOP_ITEMS.some(i => i.id === Number(x.itemId) && INV_TYPES.has(i.type))) addInv(x.itemId, n); }
  else if (x.kind === 'set_level') { rankState.xp = Math.max(0, Math.floor(+x.xp || 0)); { const nb = evaluateBadges(); if (nb.length) toast(t('badges_unlocked', {n: nb.length}), 'success'); } }
  else if (x.kind === 'set_rp') { rankState.rp = Math.max(0, Math.floor(+x.rp || 0)); rankState.peakTier = Math.max(rankState.peakTier, tierIndexFor(rankState.rp)); rankState.maxTier = Math.max(rankState.maxTier || 0, tierIndexFor(rankState.rp)); evaluateBadges(); }
  if (['stars','game','watch','item'].includes(x.kind)) { xferInfo.log.unshift({dir: 'in', who: x.from, kind: x.kind, amount: n, fee: 0, itemId: x.itemId || null, at: Date.now()}); xferInfo.log.splice(20); }
  updateUI(); renderRank(); renderShop(); renderInventory(); renderInventoryBadge(); if (currentScreen === 'transfer-screen') renderTransfer();
}

// ==================== التشغيل ====================
document.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem("theme") || "dark"; document.documentElement.setAttribute("data-theme", savedTheme);
  $('theme-toggle-checkbox').checked = (savedTheme === "light");
  if (typeof Chart !== 'undefined') Chart.defaults.font.family = "'Cairo','Plus Jakarta Sans',sans-serif";
  applyLanguage(currentLang);
  checkAuthStatus(); setupPresenceSystem(); startSpecialGameGlobalTimer();
  setInterval(() => { if (!prayerTimings) return; if (prayerDate !== new Date().toDateString()) fetchPrayerTimes(); else renderPrayer(); }, 30000);
  setInterval(() => { if (!document.hidden) tickPrayerCountdown(); }, 1000); // لا عمل أثناء إخفاء التبويب
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tickPrayerCountdown(); });
});

</script>
<script src="food-market.js"></script>
